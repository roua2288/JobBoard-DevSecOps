# Requires ingress-nginx. For local demo, use port-forward instead.
# For shared access, configure a real hostname + TLS secret and set COOKIE_SECURE=1.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobboard
  namespace: jobboard
spec:
  ingressClassName: nginx
  rules:
    - host: jobboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobboard
                port:
                  number: 8000
