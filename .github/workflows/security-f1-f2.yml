name: F1-F2 Security Pipeline

on:
  push:
    branches: [roua]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  sast:
    name: SAST - SQL Injection and XSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Security analysis
        run: semgrep scan --config security/semgrep-f1-f2.yaml --error app/

  security-tests:
    name: Security Tests - F1 and F2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run F1 and F2 tests
        run: python -m pytest tests/test_f1_f2.py -v --junitxml=security-results.xml

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-f2-security-report
          path: security-results.xml

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [sast, security-tests]
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate temporary DAST password
        run: |
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          echo "DAST_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Start JobBoard test environment
        run: |
          python -m scripts.start_dast_f1_f2 > dast-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8002/health; then
              exit 0
            fi
            sleep 2
          done
          cat dast-server.log
          exit 1

      - name: Verify HTTP security headers
        run: |
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8002/
          grep -qi "^Content-Security-Policy:" headers.txt

      - name: Authenticated F1 and F2 HTTP checks
        run: |
          pip install requests
          set -o pipefail
          python scripts/dast_f1_f2.py | tee dast-authenticated.txt

      - name: Run OWASP ZAP
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8002 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-f2-dast-report
          path: |
            zap-reports/
            dast-server.log
            headers.txt
            dast-authenticated.txt
